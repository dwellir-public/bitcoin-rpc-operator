[tox]
no_package = True
skip_missing_interpreters = True
env_list = format, lint, unit
min_version = 4.0.0

[vars]
src_path = {tox_root}/src
tests_path = {tox_root}/tests
;lib_path = {tox_root}/lib/charms/operator_name_with_underscores
all_path = {[vars]src_path} {[vars]tests_path}

[testenv]
set_env =
    PYTHONPATH = {tox_root}/lib:{[vars]src_path}
    PYTHONBREAKPOINT=pdb.set_trace
    PY_COLORS=1
pass_env =
    PYTHONPATH
    CHARM_BUILD_DIR
    MODEL_SETTINGS
    JUJU_CONTROLLER

[testenv:format]
description = Check coding style without mutating source
runner = uv-venv-lock-runner
dependency_groups =
    lint
commands =
    ruff format --check --diff {[vars]all_path}
    ruff check {[vars]all_path}

[testenv:lint]
description = Check code against coding style standards
runner = uv-venv-lock-runner
dependency_groups =
    lint
    unit
    integration
commands =
    codespell {tox_root}
    ruff check {[vars]all_path}
    ruff format --check --diff {[vars]all_path}
    pyright {posargs}

[testenv:unit]
description = Run unit tests
runner = uv-venv-lock-runner
dependency_groups =
    unit
commands =
    coverage run --source={[vars]src_path} \
                 -m pytest \
                 --tb native \
                 -v \
                 -s \
                 {posargs} \
                 {[vars]tests_path}/unit
    coverage report

[testenv:integration]
description = Run integration tests
runner = uv-venv-lock-runner
dependency_groups =
    integration
pass_env =
    CHARM_PATH
    BITCOIN_VERSION
    BITCOIN_UPDATED_VERSION
    BITCOIN_BINARY_URL
    BITCOIN_UPDATED_BINARY_URL
commands =
    pytest -v \
           -s \
           --tb native \
           --log-cli-level=INFO \
           {posargs} \
           {[vars]tests_path}/integration
