name: Release
run-name: "Release${{ inputs.prerelease && ' (prerelease)' || '' }}"

# Manual unified release of the charm + bitcoin-rpc-proxy. One tag v<version>
# (from the root VERSION file) covers both; the proxy binary is attached as
# the release asset so the charm's RPC_PROXY_DL_URL resolves:
# .../v<version>/bitcoin-rpc-proxy-<version>-linux-amd64.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark as pre-release?"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  GOLANGCI_LINT_VERSION: v2.12.2
  BINARY: bitcoin-rpc-proxy

jobs:
  initialize:
    name: "Initialize"
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.get.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: get
        run: |
          raw=$(cat VERSION)
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"

  version-bump-check:
    name: "Verify VERSION (${{ needs.initialize.outputs.version }})"
    needs: [initialize]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: VERSION bump check vs latest final tag
        shell: bash
        run: |
          set -euo pipefail
          raw=$(cat VERSION)
          NEW_VERSION=${raw#v}  # normalized X.Y.Z

          if [[ ! "$NEW_VERSION" =~ ^[0-9]+(\.[0-9]+){2}([\-+][0-9A-Za-z\.-]+)?$ ]]; then
            echo "::error::VERSION (base version) must be SemVer like 0.1.2"
            exit 1
          fi

          # latest FINAL tag: strictly vX.Y.Z (ignore prereleases and namespaced tags)
          LATEST_FINAL=$(git tag --list 'v[0-9]*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n1 || true)
          LATEST_FINAL=${LATEST_FINAL:-v0.0.0}
          OLD_VERSION=${LATEST_FINAL#v}

          echo "Latest final tag: $LATEST_FINAL"
          echo "VERSION file:     $NEW_VERSION"

          if [[ "$NEW_VERSION" == "$OLD_VERSION" ]]; then
            echo "::error::VERSION ($NEW_VERSION) must be greater than latest final ($OLD_VERSION)"
            exit 1
          fi
          if [[ "$(printf '%s\n' "$OLD_VERSION" "$NEW_VERSION" | sort -V | tail -n1)" != "$NEW_VERSION" ]]; then
            echo "::error::VERSION ($NEW_VERSION) must be greater than latest final ($OLD_VERSION)"
            exit 1
          fi
          echo "VERSION is newer than latest final: $OLD_VERSION -> $NEW_VERSION"

  changelog-check:
    name: "Verify CHANGELOG (${{ needs.initialize.outputs.version }})"
    needs: [initialize]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - name: Require changelog section for final releases
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event.inputs.prerelease }}" == "true" ]]; then
            echo "Prerelease: changelog section not required."
            exit 0
          fi
          VERSION="${{ needs.initialize.outputs.version }}"

          section=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found && /^\[[^]]+\]: / {exit}
            found {print}
          ' CHANGELOG.md)

          if [[ -z "${section// /}" ]]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          fi

          # Both verticals must be present and non-empty; "No changes this
          # release." is the explicit way to mark a vertical as unchanged.
          for vertical in Charm Proxy; do
            body=$(awk -v h="### $vertical" '
              $0 == h {found=1; next}
              found && /^#/ {exit}
              found {print}
            ' <<<"$section")
            if [[ -z "$(grep -v '^[[:space:]]*$' <<<"$body" || true)" ]]; then
              echo "::error::CHANGELOG.md [$VERSION] section '### $vertical' is missing or empty (use 'No changes this release.' if applicable)"
              exit 1
            fi
          done
          echo "Changelog section for $VERSION OK."

  golangci-lint:
    needs: [version-bump-check]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: bitcoin-rpc-proxy/go.mod
          cache-dependency-path: bitcoin-rpc-proxy/go.sum
      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: bitcoin-rpc-proxy
          args: -v

  test-race:
    name: Test race
    needs: [version-bump-check]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: bitcoin-rpc-proxy
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: bitcoin-rpc-proxy/go.mod
          cache-dependency-path: bitcoin-rpc-proxy/go.sum
      - run: go mod download
      - run: go test -mod=readonly ./... -count=1 -shuffle=on -race -timeout=5m

  release:
    name: "Build, tag & release (${{ needs.initialize.outputs.version }})"
    needs: [initialize, version-bump-check, changelog-check, golangci-lint, test-race]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      tag: ${{ steps.compute_tag.outputs.tag }}
      version: ${{ steps.compute_tag.outputs.version }}
      is_prerelease: ${{ steps.compute_tag.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: bitcoin-rpc-proxy/go.mod
          cache-dependency-path: bitcoin-rpc-proxy/go.sum

      - name: Compute tag (final or next -rc.N)
        id: compute_tag
        shell: bash
        run: |
          set -euo pipefail
          PRERELEASE="${{ github.event.inputs.prerelease }}"
          raw=$(cat VERSION)
          VERSION="${raw#v}"  # normalized base: X.Y.Z

          final_exists() { git rev-parse "v${VERSION}" >/dev/null 2>&1; }
          next_rc_tag() {
            local base="$1" maxn
            maxn=$(git tag --list "v${base}-rc*" \
              | sed -E 's/^.*-rc\.?([0-9]+)$/\1/' \
              | grep -E '^[0-9]+$' \
              | sort -n | tail -n1 || true)
            if [[ -z "${maxn:-}" ]]; then
              echo "v${base}-rc.1"
            else
              echo "v${base}-rc.$((maxn+1))"
            fi
          }

          if final_exists; then
            echo "::error::Final tag v${VERSION} already exists; bump VERSION first"
            exit 1
          fi

          if [[ "$PRERELEASE" == "true" ]]; then
            TAG="$(next_rc_tag "$VERSION")"
            IS_PRE="true"
          else
            TAG="v${VERSION}"
            IS_PRE="false"
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

          LABEL="${TAG#v}"  # X.Y.Z or X.Y.Z-rc.N
          {
            echo "version=$VERSION"
            echo "version_label=$LABEL"
            echo "tag=$TAG"
            echo "is_prerelease=$IS_PRE"
          } >> "$GITHUB_OUTPUT"
          echo "Computed tag: $TAG (prerelease=$IS_PRE)"

      - name: Build (static linux/amd64)
        working-directory: bitcoin-rpc-proxy
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: make build VERSION_LABEL=${{ steps.compute_tag.outputs.version_label }}

      - name: Stage release asset
        working-directory: bitcoin-rpc-proxy
        run: |
          set -euo pipefail
          ASSET="${BINARY}-${{ steps.compute_tag.outputs.version_label }}-linux-amd64"
          cp "./bin/${BINARY}" "./bin/${ASSET}"
          ls -lh ./bin/

      # Final releases use the changelog section as the release body; rc
      # prereleases have no changelog section and fall back to generated notes.
      - name: Extract changelog section (final releases)
        id: changelog
        if: steps.compute_tag.outputs.is_prerelease == 'false'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.compute_tag.outputs.version }}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found && /^\[[^]]+\]: / {exit}
            found {print}
          ' CHANGELOG.md > release-body.md
          echo "body_path=release-body.md" >> "$GITHUB_OUTPUT"

      - name: Create and push git tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.compute_tag.outputs.tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "chore(release): $TAG"
          git push origin "$TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.compute_tag.outputs.tag }}
          name: bitcoin-rpc ${{ steps.compute_tag.outputs.tag }}
          files: bitcoin-rpc-proxy/bin/${{ env.BINARY }}-${{ steps.compute_tag.outputs.version_label }}-linux-amd64
          prerelease: ${{ steps.compute_tag.outputs.is_prerelease }}
          body_path: ${{ steps.changelog.outputs.body_path }}
          generate_release_notes: ${{ steps.compute_tag.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.compute_tag.outputs.is_prerelease == 'false' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

  summary:
    name: Release summary
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [initialize, version-bump-check, changelog-check, golangci-lint, test-race, release]
    if: ${{ always() }}
    steps:
      - name: Write release summary
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo "## Release Summary"
            echo ""
            echo "- Version bump:  ${{ needs['version-bump-check'].result }}"
            echo "- Changelog:     ${{ needs['changelog-check'].result }}"
            echo "- Lint:          ${{ needs.golangci-lint.result }}"
            echo "- Tests (race):  ${{ needs['test-race'].result }}"
            echo "- Release:       ${{ needs.release.result }}"
            echo ""
            if [ "${{ needs.release.result }}" = "success" ] && [ -n "${{ needs.release.outputs.tag }}" ]; then
              echo "### Release"
              echo "- **Tag:** \`${{ needs.release.outputs.tag }}\`"
              echo "- **Prerelease:** \`${{ needs.release.outputs.is_prerelease }}\`"
              echo "- **Release page:** [${{ needs.release.outputs.tag }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.release.outputs.tag }})"
            else
              echo "> Release not created (see job statuses above)."
            fi
            echo ""
            echo "Triggered by: @${{ github.actor }}"
            echo "Commit: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"
            echo "[View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"
