name: Charm CI

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

# Python/tox lane for the charm itself, separate from the Go rpc-proxy lane.
# Scoped to exclude proxy-only changes so they don't trigger it.
on:
  pull_request:
    paths-ignore:
      - 'bitcoin-rpc-proxy/**'
      - '.github/workflows/rpc-proxy-*.yml'
  push:
    branches: [main]
    paths-ignore:
      - 'bitcoin-rpc-proxy/**'
      - '.github/workflows/rpc-proxy-*.yml'

jobs:
  charm-tests:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}
      - name: Record exact source commit
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: make charm-test

  exact-artifact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}
      - name: Record exact source commit
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: astral-sh/setup-uv@v6
      - run: sudo snap install charmcraft --classic
      - run: sudo charmcraft pack --quiet --destructive-mode --platform ubuntu@24.04:amd64
      - name: Verify packed dispatch across Python minor drift
        run: uv run python tests/verify_artifact_dispatch.py bitcoin-rpc_ubuntu@24.04-amd64.charm
      - uses: actions/upload-artifact@v4
        with:
          name: bitcoin-rpc-charm-${{ env.SOURCE_SHA }}
          path: bitcoin-rpc_ubuntu@24.04-amd64.charm
          if-no-files-found: error

  summary:
    name: CI Summary
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [charm-tests, exact-artifact]
    if: always() # Always run, even if earlier jobs fail
    steps:
      - name: Write CI summary
        run: |
          {
            echo "## Charm CI Summary"
            echo ""
            echo "- **Charm tests:** ${{ needs.charm-tests.result }}"
            echo "- **Exact artifact:** ${{ needs.exact-artifact.result }}"
            echo ""
            echo "### Commit"
            echo "[${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"
            echo ""
            echo "Triggered by: @${{ github.actor }}"
            echo "Event: \`${{ github.event_name }}\`"
            echo ""
            echo "[View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"
