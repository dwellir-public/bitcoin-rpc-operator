name: Release Tested Charm

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact tested commit on main
        required: true
        type: string
      integration_run_id:
        description: Successful Charm Integration workflow run ID
        required: true
        type: string
      artifact_sha256:
        description: SHA-256 of the tested charm artifact
        required: true
        type: string
      channel:
        description: Charmhub release channel
        required: true
        default: latest/edge
        type: choice
        options:
          - latest/edge
          - latest/beta
          - latest/candidate
          - latest/stable

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: github.repository == 'dwellir-public/bitcoin-rpc-operator' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: charmhub-release
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Verify source provenance
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Re-run source tests
        run: make charm-test
      - name: Download exact integration-tested artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.integration_run_id }}
          name: tested-charm-${{ inputs.source_sha }}
          path: release-artifact
      - name: Verify artifact digest
        env:
          EXPECTED_SHA256: ${{ inputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(find release-artifact -maxdepth 1 -name '*.charm' -type f | wc -l)" = 1
          artifact=$(find release-artifact -maxdepth 1 -name '*.charm' -type f)
          echo "$EXPECTED_SHA256  $artifact" | sha256sum --check --strict
      - name: Install Charmcraft
        run: sudo snap install charmcraft --classic
      - name: Upload exact artifact
        id: upload
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
        run: |
          set -euo pipefail
          artifact=$(find release-artifact -maxdepth 1 -name '*.charm' -type f)
          output=$(charmcraft upload --format=json "$artifact")
          revision=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["revision"])' <<<"$output")
          test -n "$revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - name: Release exact revision
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
          REVISION: ${{ steps.upload.outputs.revision }}
          CHANNEL: ${{ inputs.channel }}
        run: charmcraft release bitcoin-rpc --revision "$REVISION" --channel "$CHANNEL"
      - name: Verify published revision
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
          REVISION: ${{ steps.upload.outputs.revision }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          charmcraft status bitcoin-rpc > charmhub-status.txt
          grep -F "$CHANNEL" charmhub-status.txt
          grep -F "$REVISION" charmhub-status.txt
      - name: Publish provenance release
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ steps.upload.outputs.revision }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CHANNEL: ${{ inputs.channel }}
          EXPECTED_SHA256: ${{ inputs.artifact_sha256 }}
          ARTIFACT: ${{ steps.upload.outputs.artifact }}
        run: |
          set -euo pipefail
          notes=$(printf 'Charmhub channel: `%s`\n\nSource commit: `%s`\n\nArtifact SHA-256: `%s`\n' "$CHANNEL" "$SOURCE_SHA" "$EXPECTED_SHA256")
          gh release create "charm-r${REVISION}" "$ARTIFACT" \
            --target "$SOURCE_SHA" \
            --title "Bitcoin RPC charm revision ${REVISION}" \
            --notes "$notes"
