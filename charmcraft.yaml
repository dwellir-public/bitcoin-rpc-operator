# This file configures Charmcraft.
# See https://documentation.ubuntu.com/charmcraft/en/stable/reference/files/charmcraft-yaml-file/ for guidance.

name: bitcoin-rpc

type: charm

title: Bitcoin RPC Operator

summary: Bitcoin Core node with a filtering RPC proxy and Prometheus metrics.

description: |
  This charm installs and operates a Bitcoin Core full node as the bitcoind
  systemd service on an Ubuntu machine, managing the node's configuration
  and lifecycle.

  All external JSON-RPC traffic is served through a bundled filtering RPC
  proxy (bitcoind itself stays loopback-only), and node, proxy and machine
  metrics are exposed for Prometheus scraping.

links:
  website: https://dwellir.com
  source: https://github.com/dwellir-public/bitcoin-rpc-operator
  issues: https://github.com/dwellir-public/bitcoin-rpc-operator/issues

platforms:
  ubuntu@24.04:amd64:

parts:
  bitcoin-rpc-charm:
    source: .
    plugin: uv
    build-snaps:
      - astral-uv
    build-packages:
      - git
    # Stamp the charm's release tag + commit into a `charm_version` file that
    # get-node-info reads at runtime (utils.get_charm_version). Falls back to
    # the VERSION tag if .git isn't present in the build sandbox.
    override-build: |
      craftctl default
      git -c safe.directory="$CRAFT_PROJECT_DIR" -C "$CRAFT_PROJECT_DIR" describe --tags --always 2>/dev/null \
        > "$CRAFT_PART_INSTALL/charm_version" \
        || cat "$CRAFT_PART_SRC/VERSION" > "$CRAFT_PART_INSTALL/charm_version"
  root-files:
    plugin: dump
    source: .
    stage:
      - README.md
      - VERSION
      - templates/**

provides:
  node-prometheus:
    interface: prometheus-manual
  monitor-prometheus:
    interface: prometheus-manual
  rpc-proxy-prometheus:
    interface: prometheus-manual

config:
  options:
    rpc-password:
      type: string
      description: |
        The password to use for RPC authentication.
      default: ""
    rpc-user:
      type: string
      description: |
        The username to use for RPC authentication.
      default: ""
    service-args:
      type: string
      description: |
        Arguments to pass to the Bitcoin client run.
        See all available options by running --help on the client.
        Note: the charm manages the RPC endpoint and wallet flags itself.
        `-rpcbind`, `-rpcallowip`, and `-rpcport` are stripped or pinned so
        bitcoind stays loopback-only behind the proxy, and wallet flags are
        stripped when `disable-wallet` is set; setting these here has no effect.
      default: ""
    version:
      type: string
      description: |
        The version of the Bitcoin client to install.
      default: ""
    collector-s3-credentials:
      type: secret
      description: |
        Juju secret reference for the S3-compatible Hedgehog metadata target.
        The secret must contain bucket, region, access-key-id, and secret-access-key.
        endpoint-url, key-prefix, and session-token are optional.
      default: ""
    rpc-proxy-filter:
      type: boolean
      description: |
        Enforce the proxy's default-deny method allowlist (maps to --filter /
        PROXY_FILTER). The bitcoin-rpc-proxy always fronts bitcoind's JSON-RPC and
        bitcoind's RPC is always pinned to loopback; this only controls whether the
        allowlist is applied. Set to false to forward EVERY method (a "fully open"
        node): this exposes dangerous methods such as 'stop' and, unless
        disable-wallet is true, wallet methods. Leave true unless you intentionally
        want an unfiltered node.
      default: true
    rpc-proxy-version:
      type: string
      description: |
        The version of the bitcoin-rpc-proxy binary to install, matching a
        v<version> release of this repository. The proxy is the node's only RPC
        front door (bitcoind is loopback-only), so this must resolve to a published
        release asset; if the binary is missing the unit blocks.
      default: "0.1.0"
    rpc-proxy-listen:
      type: string
      description: |
        Address:port the proxy serves JSON-RPC on (maps to PROXY_LISTEN).
      default: "0.0.0.0:8331"
    rpc-proxy-extend-allowlist:
      type: string
      description: |
        Comma-separated JSON-RPC methods to add to the proxy's SAFE baseline
        allowlist (maps to --extend-allowlist / PROXY_EXTEND_ALLOWLIST).
      default: ""
    disable-wallet:
      type: boolean
      description: |
        Inject -disablewallet into bitcoind's args (stripping conflicting wallet
        flags from service-args).
      default: true

actions:
  get-node-help:
    description: |
      Gets the output from the --help command of the Bitcoin client.
  get-node-info:
    description: |
      Gets system information about the node for debugging purposes,
      including bitcoind and rpc-proxy status.
  print-event-log:
    description: |
      Prints the full recorded event log (up to 256 latest events).
  print-readme:
    description: |
      Prints this charm's README, with usage and configuration details, to the action output.
  restart-node:
    description: |
      This action restarts the Bitcoin client service and the rpc-proxy.
  start-node:
    description: |
      This action starts the Bitcoin client service, the monitor and the rpc-proxy.
  stop-node:
    description: |
      This action stops the Bitcoin client service, the monitor and the rpc-proxy.
